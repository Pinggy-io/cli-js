name: E2E Binary Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x64
            runner: ubuntu-latest
            pack_script: pack:linux-x64
            binary: out/pinggy-linux-x64

          - name: Windows-x64
            runner: windows-latest
            pack_script: pack:win-x64
            binary: out/pinggy-win-x64.exe

          - name: Linux-arm64
            runner: ubuntu-24.04-arm
            pack_script: pack:linux-arm64
            binary: out/pinggy-linux-arm64

          - name: Windows-arm64
            runner: windows-11-arm
            pack_script: pack:win-arm64
            binary: out/pinggy-win-arm64.exe

          - name: macOS-x64
            runner: macos-15-intel
            pack_script: pack:macos-x64
            binary: out/pinggy-macos-x64

          - name: macOS-arm64
            runner: macos-15
            pack_script: pack:macos-arm64
            binary: out/pinggy-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (tsup)
        run: npm run build

      - name: Build binary (pkg)
        run: npm run ${{ matrix.pack_script }}

      - name: Verify binary exists (Unix)
        if: runner.os != 'Windows'
        run: ls -lh ${{ matrix.binary }} && chmod +x ${{ matrix.binary }}

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Item "${{ matrix.binary }}" | Select-Object Name, Length, LastWriteTime

      - name: Run E2E suite
        run: node test/e2e/run.cjs ${{ matrix.binary }}
